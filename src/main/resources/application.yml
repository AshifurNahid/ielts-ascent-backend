spring:
  application:
    name: ielts-ascent-backend
  profiles:
    active: test, local
  jpa:
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        format_sql: true
  ai:
    openai:
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:${SPRING_AI_OPENAI_API_KEY:}}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.2
server:
  port: 8080

logging:
  level:
    root: INFO
    com.ieltsascent.backend: DEBUG

jwt:
  issuer: ielts-ascent
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:7200}
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:604800}
  secret: ${JWT_SECRET:mixd8UW7KepiSPnS3qtjv9TsDQT5bekRgVVM5HzS031f49NwrKfr2jhEphX}

security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Requested-With}
    max-age-seconds: ${CORS_MAX_AGE_SECONDS:3600}

ai:
  provider: ${AI_PROVIDER:mock}
  base-url: ${AI_BASE_URL:https://example-ai-provider.com}
  api-key: ${AI_API_KEY:replace-me}
  model:
    writing: ${AI_MODEL_WRITING:}
  timeout-ms: ${AI_TIMEOUT_MS:20000}
  max-retries: ${AI_MAX_RETRIES:2}
  temperature: ${AI_TEMPERATURE:0.1}
  gemini:
    base-url: ${AI_GEMINI_BASE_URL:https://example-ai-provider.com}
    api-key: ${AI_GEMINI_API_KEY:replace-me}
  groq:
    base-url: ${AI_GROQ_BASE_URL:https://example-ai-provider.com}
    api-key: ${AI_GROQ_API_KEY:replace-me}
  openai:
    base-url: ${AI_OPENAI_BASE_URL:https://example-ai-provider.com}
    api-key: ${AI_OPENAI_API_KEY:replace-me}

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /swagger-ui.html
    url: /api/docs
    try-it-out-enabled: true
    display-request-duration: true
