spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ielts_ascent
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true

logging:
  level:
    org.springframework.security: INFO
    org.flywaydb: DEBUG
